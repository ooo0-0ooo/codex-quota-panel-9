name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Quota-Panel-Windows
          path: dist/*.exe
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = @"
          ## Downloads / 下载说明

          - **Setup / 安装版**<br>
            Recommended for regular use. Includes installation, shortcuts, and an uninstaller.<br>
            推荐长期使用，包含标准安装流程、快捷方式和卸载程序。

          - **Portable / 便携版**<br>
            No installation required. Download and run directly.<br>
            无需安装，下载后即可直接运行。
          "@
          gh release create "${{ github.ref_name }}" `
            --title "Codex Quota Panel ${{ github.ref_name }}" `
            --notes $notes `
            --verify-tag
          gh release upload "${{ github.ref_name }}" `
            "dist/Codex-Quota-Panel-${{ github.ref_name }}-Setup.exe"
          gh release upload "${{ github.ref_name }}" `
            "dist/Codex-Quota-Panel-${{ github.ref_name }}-Portable.exe"
